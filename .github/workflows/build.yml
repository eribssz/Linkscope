name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          LINKSCOPE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LINKSCOPE_KEYSTORE: ${{ runner.temp }}/sideload.keystore
          # Optional: only needed if the key's password differs from the keystore's.
          LINKSCOPE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$LINKSCOPE_KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the KEYSTORE_BASE64 and KEYSTORE_PASSWORD repository secrets."; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$LINKSCOPE_KEYSTORE"
          # Use the first private key in the keystore, whatever its alias.
          ALIAS=$(keytool -list -keystore "$LINKSCOPE_KEYSTORE" -storepass "$LINKSCOPE_KEYSTORE_PASSWORD" 2>/dev/null \
            | grep -i "PrivateKeyEntry" | head -1 | cut -d, -f1)
          if [ -z "$ALIAS" ]; then echo "::error::Couldn't read the keystore. Check KEYSTORE_BASE64 and KEYSTORE_PASSWORD."; exit 1; fi
          echo "Signing with key alias: $ALIAS"
          export LINKSCOPE_KEY_ALIAS="$ALIAS"
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Linkscope.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linkscope-apk
          path: out/Linkscope.apk

      # A GitHub Release gives a plain download link that's easy to open on a phone.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Linkscope build ${{ github.run_number }}
          files: out/Linkscope.apk
          make_latest: true
