name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Linkscope.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linkscope-apk
          path: out/Linkscope.apk

      # A GitHub Release gives a plain download link that's easy to open on a phone.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Linkscope build ${{ github.run_number }}
          files: out/Linkscope.apk
          make_latest: true
